---
on: issue_comment

jobs:
  pr_commented:
    # This job only runs for pull request comments
    name: PR comment
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo A comment by ${{ github.event.sender.login }} who is a ${{ github.event.comment.author_association }} on PR ${{ github.event.issue.number }}
